name: Supabase Keep-Alive

on:
  schedule:
    # Toutes les 3 jours, bien en deçà de la fenêtre d'inactivité de 7 jours de Supabase
    - cron: '0 12 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    name: Ping Supabase REST API
    steps:
      - name: Ping Supabase
        run: |
          set -o pipefail
          # Une vraie lecture de table : la racine PostgREST (/rest/v1/) est refusée
          # avec la clé anon (401) et ne constitue pas une requête sur la base, alors
          # que Supabase mesure l'inactivité sur les requêtes utilisateur.
          # `recettes` est lisible publiquement (policy SELECT pour le rôle public).
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          status=$(curl -sS -o "$body" -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/recettes?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}") || {
              echo "::error::La requête curl vers Supabase a échoué (erreur réseau/SSL)"
              exit 1
            }
          echo "Supabase REST API a répondu avec le code $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
            echo "Réponse :"
            cat "$body"
            # Termine la ligne : sans ça, une réponse sans saut de ligne final
            # collerait le ::error:: en fin de ligne et GitHub ne le lirait plus
            # comme une commande de workflow.
            echo
            echo "::error::Le ping Supabase a échoué avec le code $status"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
